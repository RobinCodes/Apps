<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Hermione. The thing the app is: a folder made of glass. The shape is a
       plain folder so it reads as a file manager at 16px, where none of the
       glass survives — which is why the colour behind it is clipped to the
       folder rather than blooming past it: at small sizes that leaves a
       crisp coloured silhouette against the dark tile, and at large sizes it
       looks like the desktop showing through, which is what the window
       itself does. Pure shapes and gradients, no text, so it depends on no
       font being installed. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#15181f"/>
    </linearGradient>

    <!-- the folder's outline, used both to draw it and to clip what shows
         through it -->
    <path id="folder"
          d="M20 44 h30 l8.5 11 h41.5 a10 10 0 0 1 10 10 v32 a10 10 0 0 1 -10 10
             H20 a10 10 0 0 1 -10 -10 V54 a10 10 0 0 1 10 -10 Z"/>
    <clipPath id="inside">
      <use href="#folder"/>
    </clipPath>

    <linearGradient id="pane" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
  </defs>

  <!-- the tile -->
  <rect x="6" y="9" width="116" height="112" rx="18" fill="#0b0d12" opacity="0.22"
        transform="translate(0,3)"/>
  <rect x="6" y="9" width="116" height="112" rx="18" fill="url(#ground)"/>

  <!-- what is behind the glass, seen only through it -->
  <g clip-path="url(#inside)">
    <rect x="10" y="44" width="100" height="63" fill="#3f4a66"/>
    <circle cx="34" cy="58" r="30" fill="#6ea8ff" opacity="0.95"/>
    <circle cx="74" cy="66" r="30" fill="#9b6ef3" opacity="0.9"/>
    <circle cx="104" cy="104" r="30" fill="#f0609f" opacity="0.85"/>
    <circle cx="20" cy="104" r="22" fill="#4ad6c0" opacity="0.7"/>
  </g>

  <!-- the glass over it -->
  <use href="#folder" fill="url(#pane)"/>
  <use href="#folder" fill="url(#sheen)"/>

  <!-- three things inside it, which is what a folder is for -->
  <g clip-path="url(#inside)">
    <rect x="24" y="70" width="40" height="6" rx="3" fill="#ffffff" opacity="0.80"/>
    <rect x="24" y="82" width="62" height="6" rx="3" fill="#ffffff" opacity="0.55"/>
    <rect x="24" y="94" width="30" height="6" rx="3" fill="#ffffff" opacity="0.38"/>
  </g>

  <!-- the rim: a bright hairline along the lit edge and a fainter one all
       the way round, which is what reads as an edge of glass -->
  <use href="#folder" fill="none" stroke="#ffffff" stroke-opacity="0.30"
       stroke-width="2"/>
  <path d="M20 44 h30 l8.5 11 h41.5 a10 10 0 0 1 10 10"
        fill="none" stroke="url(#rim)" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
