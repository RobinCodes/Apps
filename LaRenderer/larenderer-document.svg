<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A LaTeX document, as Explorer shows one once LaRenderer opens it: the
       same turned-corner page as Notedown's documents, the integral from the
       app icon on it, and the app's sheet as a badge. Paths and rects only,
       like the app icon, so nothing depends on a font. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edf5"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c4fb8"/>
    </linearGradient>
    <!-- The app icon's integral, whole. Drawn at two sizes below. -->
    <path id="integral" d="M 88 48
             C 88 32, 74 26, 66 34
             C 60 40, 59 49, 59 60
             L 59 78
             C 59 89, 58 97, 51 103
             C 43 110, 30 103, 30 88"
          fill="none" stroke="url(#ink)" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <!-- the page and its shadow -->
  <path d="M 26 8 H 80 L 106 34 V 116 A 6 6 0 0 1 100 122 H 26 A 6 6 0 0 1 20 116 V 14 A 6 6 0 0 1 26 8 Z"
        fill="#0f1b33" opacity="0.20" transform="translate(0,3)"/>
  <path d="M 26 8 H 80 L 106 34 V 116 A 6 6 0 0 1 100 122 H 26 A 6 6 0 0 1 20 116 V 14 A 6 6 0 0 1 26 8 Z"
        fill="url(#page)" stroke="#c2cad9" stroke-width="2"/>
  <!-- the turned corner -->
  <path d="M 80 8 V 28 A 6 6 0 0 0 86 34 H 106 Z" fill="#d5dbe7" stroke="#c2cad9"
        stroke-width="2" stroke-linejoin="round"/>

  <!-- the integral, where Notedown's page has the Markdown mark -->
  <use href="#integral" transform="translate(21.5 22.5) scale(0.64)"/>

  <!-- set text, below and above it -->
  <g fill="#9aa7bd">
    <rect x="30" y="20" width="36" height="5" rx="2" opacity="0.7"/>
    <rect x="30" y="96" width="46" height="5" rx="2"/>
    <rect x="30" y="106" width="34" height="5" rx="2"/>
  </g>

  <!-- the LaRenderer badge: its sheet with the integral, small, bottom right -->
  <rect x="84" y="89" width="30" height="35" rx="6" fill="#0f1b33" opacity="0.2"
        transform="translate(0,2)"/>
  <rect x="84" y="89" width="30" height="35" rx="6" fill="#ffffff" stroke="#c2cad9"
        stroke-width="1.5"/>
  <use href="#integral" transform="translate(80.4 85.4) scale(0.32)"/>
</svg>
