<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- A web page saved to disk, as Explorer shows one once Lyndon opens it:
       the turned-corner page the other apps' documents use, a tag drawn on
       it, and Lyndon's globe as a badge. Paths only, so no font is needed. -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f5bf6"/>
      <stop offset="1" stop-color="#2a3bd0"/>
    </linearGradient>
  </defs>

  <!-- the page and its shadow -->
  <path d="M 26 8 H 80 L 106 34 V 116 A 6 6 0 0 1 100 122 H 26 A 6 6 0 0 1 20 116 V 14 A 6 6 0 0 1 26 8 Z"
        fill="#0d1729" opacity="0.20" transform="translate(0,3)"/>
  <path d="M 26 8 H 80 L 106 34 V 116 A 6 6 0 0 1 100 122 H 26 A 6 6 0 0 1 20 116 V 14 A 6 6 0 0 1 26 8 Z"
        fill="url(#page)" stroke="#c2cad9" stroke-width="2"/>
  <!-- the turned corner -->
  <path d="M 80 8 V 28 A 6 6 0 0 0 86 34 H 106 Z" fill="#d5dbe7" stroke="#c2cad9"
        stroke-width="2" stroke-linejoin="round"/>

  <!-- a tag, </>, in the browser's blue -->
  <g fill="none" stroke="#3549e8" stroke-width="6" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M 45 52 L 32 66 L 45 80"/>
    <path d="M 70 48 L 57 84"/>
    <path d="M 82 52 L 95 66 L 82 80"/>
  </g>

  <!-- a few lines of text below -->
  <g fill="#9aa7bd">
    <rect x="30" y="96" width="46" height="5" rx="2"/>
    <rect x="30" y="106" width="34" height="5" rx="2"/>
  </g>

  <!-- the Lyndon badge: its globe on its blue tile, small, bottom right -->
  <rect x="82" y="90" width="34" height="34" rx="9" fill="#0d1729" opacity="0.2"
        transform="translate(0,2)"/>
  <rect x="82" y="90" width="34" height="34" rx="9" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="99" cy="107" r="10" stroke-width="1.8"/>
    <path d="M99 97c-3.6 4.1-3.6 15.9 0 20M99 97c3.6 4.1 3.6 15.9 0 20"
          stroke-width="1.4" opacity=".72"/>
    <path d="M89.6 103.4h18.8M89.6 110.6h18.8" stroke-width="1.4" opacity=".72"/>
  </g>
</svg>
