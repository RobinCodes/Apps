<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Mnemosyne. A card, answered: the question above the fold, four tick
       boxes below it with the third — Good — ticked, and a second card behind
       it, because a card is never seen only once. The arc round the corner is
       the spacing: it comes back. Pure paths and rects, no text, so it does
       not depend on a font; the fold and the ticked box are the strongest
       marks in it, so it still reads as a card at 16px. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebeef6"/>
    </linearGradient>
    <linearGradient id="behind" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e7f1"/>
      <stop offset="1" stop-color="#cfd6e4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#5a24c2"/>
    </linearGradient>
  </defs>

  <!-- the card behind, turned a little -->
  <g transform="rotate(-9 64 66)">
    <rect x="20" y="20" width="84" height="92" rx="10" fill="#0d1729" opacity="0.16"
          transform="translate(0,3)"/>
    <rect x="20" y="20" width="84" height="92" rx="10" fill="url(#behind)"/>
  </g>

  <!-- the card in front, with its shadow -->
  <rect x="26" y="22" width="84" height="94" rx="10" fill="#0d1729" opacity="0.22"
        transform="translate(0,3)"/>
  <rect x="26" y="22" width="84" height="94" rx="10" fill="url(#card)"/>

  <!-- the question: a mark and two lines of it -->
  <path d="M 39 41 a 6.5 6.5 0 1 1 9 6 c -2.2 1 -2.5 2.2 -2.5 4.5" fill="none"
        stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45.5" cy="57.5" r="2.4" fill="#5a24c2"/>
  <g fill="#9aa7bd">
    <rect x="58" y="38" width="40" height="5" rx="2"/>
    <rect x="58" y="49" width="30" height="5" rx="2"/>
  </g>

  <!-- the fold -->
  <path d="M 32 70 H 104" stroke="#aab4c6" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- four boxes, the third ticked -->
  <g fill="none" stroke="#8d98ad" stroke-width="2.4">
    <rect x="35" y="84" width="13" height="13" rx="3"/>
    <rect x="53" y="84" width="13" height="13" rx="3"/>
    <rect x="89" y="84" width="13" height="13" rx="3"/>
  </g>
  <rect x="70" y="83" width="15" height="15" rx="3.5" fill="url(#accent)"/>
  <path d="M 73.4 90.6 L 76.6 93.8 L 81.8 86.8" fill="none" stroke="#ffffff"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the arc: it comes back -->
  <path d="M 100 12 A 18 18 0 0 1 120 30" fill="none" stroke="url(#accent)"
        stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 113.5 28.5 L 120 33 L 124.5 26" fill="none" stroke="#5a24c2"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
