<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Notedown. The thing the app is: one sheet, split down the middle, with
       the marks on the left and what they turn into on the right. Pure paths
       and rects — no text elements, so it does not depend on any font being
       installed — and the split is the strongest line in it, so it still
       reads as two halves at 16px. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8ecf4"/>
    </linearGradient>
    <linearGradient id="source" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f9"/>
      <stop offset="1" stop-color="#dde3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1a54c0"/>
    </linearGradient>
  </defs>

  <!-- the sheet, with its shadow -->
  <rect x="12" y="10" width="104" height="108" rx="11" fill="#0d1729" opacity="0.20"
        transform="translate(0,3)"/>
  <rect x="12" y="10" width="104" height="108" rx="11" fill="url(#sheet)"/>

  <!-- the left half: the text you type, on its own slightly cooler ground -->
  <path d="M 23 10 H 64 V 118 H 23 A 11 11 0 0 1 12 107 V 21 A 11 11 0 0 1 23 10 Z"
        fill="url(#source)"/>

  <!-- a hash, drawn rather than typed -->
  <g fill="#8a3ffc">
    <rect x="25" y="26" width="5"  height="20" rx="2" transform="rotate(10 27.5 36)"/>
    <rect x="34" y="26" width="5"  height="20" rx="2" transform="rotate(10 36.5 36)"/>
    <rect x="21" y="31" width="22" height="5"  rx="2"/>
    <rect x="21" y="39" width="22" height="5"  rx="2"/>
  </g>

  <!-- source lines: a couple of marks, then plain runs -->
  <g fill="#9aa7bd">
    <rect x="21" y="56" width="6"  height="5" rx="2" fill="#8a3ffc"/>
    <rect x="30" y="56" width="26" height="5" rx="2"/>
    <rect x="21" y="67" width="6"  height="5" rx="2" fill="#8a3ffc"/>
    <rect x="30" y="67" width="20" height="5" rx="2"/>
    <rect x="21" y="78" width="35" height="5" rx="2"/>
    <rect x="21" y="89" width="28" height="5" rx="2"/>
    <rect x="21" y="100" width="31" height="5" rx="2"/>
  </g>

  <!-- the divider -->
  <rect x="63" y="10" width="2" height="108" fill="#c2cad9"/>

  <!-- the right half: what it turned into. A heading with its rule, then body. -->
  <rect x="72" y="26" width="34" height="9" rx="4" fill="url(#accent)"/>
  <rect x="72" y="41" width="36" height="2" rx="1" fill="#c2cad9"/>

  <g fill="#7d8798">
    <rect x="72" y="52" width="34" height="5" rx="2"/>
    <rect x="72" y="63" width="30" height="5" rx="2"/>
  </g>

  <!-- a ticked task, because that is the bit that writes back to the file -->
  <rect x="72" y="75" width="10" height="10" rx="3" fill="url(#accent)"/>
  <path d="M 74.4 80.2 L 76.6 82.4 L 80.0 77.8" fill="none" stroke="#ffffff"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="87" y="77" width="19" height="5" rx="2" fill="#7d8798"/>

  <g fill="#7d8798">
    <rect x="72" y="93" width="34" height="5" rx="2"/>
    <rect x="72" y="104" width="24" height="5" rx="2"/>
  </g>
</svg>
